name: CI

# Monorepo: this workflow lives at the repository root (GitHub Actions only
# reads .github/workflows/ at the root) and runs the SGS-app frontend quality
# gates from the SGS-app directory. Backend CI can be added as a second job.
on:
  push:
    branches: [main]
    paths:
      - "SGS-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "SGS-app/**"
      - ".github/workflows/ci.yml"

jobs:
  frontend:
    name: Frontend · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SGS-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Monorepo: the lockfile is inside SGS-app, not at the root.
          cache-dependency-path: SGS-app/package-lock.json

      # `npm ci` runs the `prepare` script (husky + gen-cities), so the
      # generated public/data/cities/ files exist before tests run.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: i18n audit (fr/en parity + key usage)
        run: npm run audit:i18n

      - name: Swagger coverage (every endpoint consumed)
        run: npm run audit:endpoints

      - name: Tests (vitest)
        run: npm test
